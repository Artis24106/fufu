<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SDVX 練習">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>SDVX Pattern Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: practice pad — quiet, numbers only where they matter
   IDEA: the controller itself; the metronome is the chart
   PICTURE: 4 BT + 2 FX filling the screen, each hit stamps its ms deviation on the key
   COLOUR and TYPE: deep indigo, white BT, orange FX, cyan = steady, red = wrong; Chakra Petch numerals
   LAYOUT: one thin strip (sequence + live σ / accuracy), the rest is pad; stats in a sheet */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;--bg:#070920;--ink:#eef1ff;--mut:#8f96bd;--fx:#ff8a1f;--ok:#4dffc3;--mid:#ffe14d;--bad:#ff4d6d;--sheet:#11143a;--line:#262b5c}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070920}
#probe{position:fixed;left:0;top:0;width:100vw;height:100lvh;visibility:hidden;pointer-events:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Chakra Petch",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;display:flex;flex-direction:column;gap:8px;transform-origin:0 0;overflow:hidden;
  padding:6px max(8px,var(--sr),calc((100% - 960px)/2)) max(8px,var(--sb)) max(8px,var(--sl),calc((100% - 960px)/2))}
#app.rot{padding:6px max(8px,var(--st),var(--sb),calc((100% - 960px)/2)) 8px}
.bar{flex:none;height:46px;display:flex;align-items:center;gap:8px}
.hb{height:40px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#151946;font-weight:700;flex:none}
.hb:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
#play{background:var(--ok);color:#03201a;border-color:transparent;min-width:72px}
#mid{flex:1;display:flex;flex-direction:column;gap:3px;overflow:hidden}
#seq{display:flex;gap:3px;height:16px;overflow:hidden}
#seq i{flex:0 0 auto;min-width:20px;padding:0 3px;border-radius:4px;background:#161a45;color:var(--mut);font:600 11px/16px "Chakra Petch",sans-serif;text-align:center;font-style:normal}
#seq i.on{background:var(--ink);color:#070920}
#live{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#live b{color:var(--ink);font-weight:700}
#pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:3fr 2fr;gap:8px;touch-action:none}
.k{position:relative;border:0;border-radius:14px;touch-action:none;transition:transform .04s;display:grid;place-items:center;overflow:hidden}
.bt{background:linear-gradient(#fff,#cdd2ec);box-shadow:0 5px 0 #6c7399;color:#1a1f4a}
.fx{grid-column:span 2;background:linear-gradient(#ffad5c,#e66d00);box-shadow:0 5px 0 #8a3f00;color:#3a1600}
.k.on{transform:translateY(4px);box-shadow:0 1px 0 #3a3f63}
.k.nx::after{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 4px rgba(46,197,255,.95),inset 0 0 26px rgba(46,197,255,.55)}
.k .fb{font:700 clamp(18px,5vmin,30px)/1 "Chakra Petch",sans-serif;font-variant-numeric:tabular-nums;opacity:0}
.k .fb.pop{animation:pop .5s ease-out}
.k.miss{animation:miss .3s}
@keyframes pop{0%{opacity:1;transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:none}}
@keyframes miss{0%,60%{box-shadow:inset 0 0 0 5px var(--bad),0 5px 0 #6c7399}}
#sheet{position:absolute;inset:0;background:rgba(3,4,16,.75);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
.card{width:min(820px,100%);max-height:96%;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;padding:16px 18px 20px;border-top:1px solid var(--line)}
.card h2{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.card h3{margin:18px 0 8px;font-size:15px;color:var(--mut);font-weight:600}
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.big div,.lanes div{background:#0b0e2c;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mut)}
.big b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.lanes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
.lanes b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.fig{position:relative;height:150px;margin-top:8px;background:#0b0e2c;border-radius:10px}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mut)}
label.f b{color:var(--ink);font-variant-numeric:tabular-nums}
select,input[type=text]{height:44px;border-radius:10px;border:1px solid var(--line);background:#0b0e2c;padding:0 10px;font-size:16px}
input[type=range]{width:100%;height:30px;accent-color:var(--ok)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--ok)}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
@media(prefers-reduced-motion:reduce){.k,.k .fb.pop{transition:none;animation:none}}
</style>
</head>
<body>
<div id="probe"></div>
<div id="app">
  <div class="bar">
    <button class="hb" id="gear">設定</button>
    <div id="mid"><div id="seq"></div><div id="live">按「開始」，先有 1 小節預備拍</div></div>
    <button class="hb" id="play">開始</button>
  </div>
  <div id="pad">
    <button class="k bt" data-l="0" aria-label="BT-A"><span class="fb"></span></button>
    <button class="k bt" data-l="1" aria-label="BT-B"><span class="fb"></span></button>
    <button class="k bt" data-l="2" aria-label="BT-C"><span class="fb"></span></button>
    <button class="k bt" data-l="3" aria-label="BT-D"><span class="fb"></span></button>
    <button class="k fx" data-l="4" aria-label="FX-L"><span class="fb"></span></button>
    <button class="k fx" data-l="5" aria-label="FX-R"><span class="fb"></span></button>
  </div>

  <div id="sheet" hidden>
    <div class="card">
      <h2>結果與設定 <button class="hb" id="close">完成</button></h2>
      <div class="big" id="big"></div>
      <div class="lanes" id="lanes"></div>
      <div class="fig"><canvas id="sc"></canvas></div>
      <p class="hint">散點圖是最近 120 下的偏差，往上 = 偏晚，往下 = 偏早，綠帶 = ±20 ms。σ 越小越穩。</p>
      <div class="row"><span id="avg" class="hint" style="margin:0"></span><button class="hb" id="applyOff">把平均偏差設為 offset</button><button class="hb" id="resetStats">清除統計</button></div>

      <h3>練習設定</h3>
      <div class="grid">
        <label class="f">Pattern<select id="pat"></select></label>
        <label class="f" id="customWrap">自訂（A–D = BT，L/R = FX，- = 空拍）
          <input type="text" id="custom" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <label class="f">BPM <b id="bpmV"></b><input type="range" id="bpm" min="60" max="400" step="1"></label>
        <label class="f">音符間隔<select id="div">
          <option value="4">4 分</option><option value="8">8 分</option><option value="12">12 分（三連）</option>
          <option value="16">16 分</option><option value="24">24 分</option><option value="32">32 分</option></select></label>
        <label class="f">節拍器<select id="click">
          <option value="step">每個音符都響</option><option value="beat">只響拍子（4 分）</option><option value="off">關閉</option></select></label>
        <label class="f">offset <b id="offV"></b><input type="range" id="offset" min="-150" max="150" step="1"></label>
        <label class="chk"><input type="checkbox" id="hint">亮出下一顆要按的鍵</label>
        <label class="chk"><input type="checkbox" id="flip">直拿時反轉橫向方向</label>
      </div>
      <p class="hint">iPhone 靜音模式下沒有節拍聲。offset 只影響「平均偏早/偏晚」，不影響 σ。版本 <span id="ver"></span></p>
    </div>
  </div>
</div>

<script>
{
const VERSION='v2.0';
const $=s=>document.querySelector(s);
const PATS=[
  {id:'up',n:'樓梯 ↗',s:'A B C D'},{id:'down',n:'樓梯 ↘',s:'D C B A'},{id:'zig',n:'來回樓梯',s:'A B C D C B'},
  {id:'in',n:'交互・內側',s:'B C'},{id:'out',n:'交互・外側',s:'A D'},{id:'jump',n:'跳躍',s:'A C B D'},
  {id:'dbl',n:'雙押交互',s:'AB CD'},{id:'split',n:'分離交互',s:'AC BD'},{id:'dstair',n:'雙押樓梯',s:'AB BC CD BC'},
  {id:'jack',n:'縱連',s:'A A B B C C D D'},{id:'fx',n:'FX 交互',s:'L R'},{id:'btfx',n:'BT + FX 同押',s:'AL B C DR'},
  {id:'fxmix',n:'FX 夾 BT',s:'L B R C'},{id:'rnd',n:'隨機單押',gen:'single'},{id:'rnd2',n:'隨機（含雙押/FX）',gen:'mix'},{id:'custom',n:'自訂'}
];
const NAMES='ABCDLR';
const DEF={pat:'up',custom:'A B C D AB CD L R',bpm:160,div:16,click:'step',offset:0,hint:true,flip:false};
const S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('sdvxp2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sdvxp2',JSON.stringify(S))}catch(e){}};

const parse=str=>{const out=String(str).toUpperCase().split(/[\s,]+/).filter(Boolean).map(t=>{const s=new Set();for(const c of t){const i=NAMES.indexOf(c);if(i>=0)s.add(i)}return[...s]});
  return out.some(x=>x.length)?out:[[0]]};
let lastR=-1;
const genStep=mode=>{const one=()=>{let l;do{l=Math.floor(Math.random()*4)}while(l===lastR);lastR=l;return l};
  if(mode==='single')return[one()];const r=Math.random();
  if(r<.22){const a=one();let b;do{b=Math.floor(Math.random()*4)}while(b===a);return[a,b]}
  if(r<.34)return[Math.random()<.5?4:5];return[one()]};

// ---- audio
let ac=null;
const ensureAudio=()=>{try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
const beep=(t,f,v)=>{if(!ac)return;try{const at=ac.currentTime+Math.max(0,(t-performance.now())/1000);
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';
  g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.0001,at+.03);o.connect(g).connect(ac.destination);o.start(at);o.stop(at+.035)}catch(e){}};

// ---- engine
let run=false,paused=false,pausedAt=0,t0=0,stepMs=100,seq=null,pat=PATS[0],cyc=16,kGen=0,kDone=0,beatSteps=4;
let steps=new Map(),st,hist=[];
const resetStats=()=>{st={ok:0,wrong:0,miss:0,streak:0,max:0};hist=[]};resetStats();
const setup=()=>{pat=PATS.find(p=>p.id===S.pat)||PATS[0];seq=pat.gen?null:parse(pat.id==='custom'?S.custom:pat.s);
  cyc=seq?seq.length:16;stepMs=60000/S.bpm*4/S.div;beatSteps=Math.max(1,S.div/4);renderSeq()};
const start=()=>{ensureAudio();setup();steps=new Map();resetStats();lastR=-1;
  kGen=-S.div;kDone=0;t0=performance.now()+300+S.div*stepMs;run=true;paused=false;lastNx=null;ui()};
const pause=()=>{if(!run||paused)return;paused=true;pausedAt=performance.now();try{ac&&ac.suspend()}catch(e){}ui()};
const resume=()=>{if(!paused)return;ensureAudio();t0+=performance.now()-pausedAt;paused=false;ui()};
const toggle=()=>{if(!run)start();else if(paused)resume();else pause()};
const stepT=k=>t0+k*stepMs;
const getStep=k=>{let s=steps.get(k);if(!s){s={lanes:seq?seq[((k%cyc)+cyc)%cyc]:genStep(pat.gen),hit:new Set()};steps.set(k,s)}return s};

const schedule=now=>{
  while(stepT(kGen)<now+150){
    const k=kGen,t=stepT(k);
    if(k<0){if(k%beatSteps===0)beep(t,k===-S.div?2000:1500,.12)}
    else{const s=getStep(k);
      if(S.click==='step'&&s.lanes.length)beep(t,k%cyc===0?2100:1500,.1);
      else if(S.click==='beat'&&k%beatSteps===0)beep(t,k%(beatSteps*4)===0?2100:1500,.12)}
    kGen++}
};
const finalize=now=>{
  const win=Math.min(stepMs,160);
  while(kDone<kGen&&now-S.offset>stepT(kDone)+win){
    const s=getStep(kDone);
    for(const l of s.lanes)if(!s.hit.has(l)){st.miss++;st.streak=0;fbMiss(l)}
    steps.delete(kDone);kDone++}
};
const press=l=>{
  const now=performance.now();
  if(!run||paused)return;
  const t=now-S.offset,kf=(t-t0)/stepMs,k=Math.round(kf);
  if(k<0||k<kDone-1)return;
  const win=Math.min(stepMs,160);
  const cand=[k,kf>k?k+1:k-1].filter(x=>x>=kDone&&x<kGen);
  for(const c of cand){const s=getStep(c),d=t-stepT(c);
    if(s.lanes.includes(l)&&!s.hit.has(l)&&Math.abs(d)<=win){
      s.hit.add(l);st.ok++;st.streak++;st.max=Math.max(st.max,st.streak);
      hist.push({d,l});if(hist.length>2000)hist.shift();fbHit(l,d);return}}
  st.wrong++;st.streak=0;fbWrong(l)
};

// ---- feedback on keys
const keys=[...document.querySelectorAll('.k')];
const col=d=>{const a=Math.abs(d);return a<=20?'var(--ok)':a<=40?'var(--mid)':'var(--bad)'};
const pop=(l,txt,c)=>{const f=keys[l].querySelector('.fb');f.textContent=txt;f.style.color=c;f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop')};
const fbHit=(l,d)=>pop(l,(d>=0?'+':'')+Math.round(d),col(d));
const fbWrong=l=>pop(l,'✕','var(--bad)');
const fbMiss=l=>{const k=keys[l];k.classList.remove('miss');void k.offsetWidth;k.classList.add('miss')};

// ---- stats
const sd=a=>{if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const acc=()=>{const tot=st.ok+st.wrong+st.miss;return tot?st.ok/tot*100:null};
const fmt=(v,u='')=>v===null?'–':Math.round(v)+u;
let lastLive=0;
const live=now=>{
  if(now-lastLive<120)return;lastLive=now;
  const el=$('#live');
  if(!run){return}
  if(paused){el.textContent='暫停中 — 點「設定」看詳細結果';return}
  if(now<t0){const beats=Math.ceil((t0-now)/(stepMs*beatSteps));el.textContent='預備… '+beats;return}
  const r=hist.slice(-48).map(h=>h.d),s=sd(r),m=mean(r),a=acc();
  el.innerHTML=`正確 <b>${fmt(a,'%')}</b> · σ <b style="color:${s===null?'inherit':col(s)}">${fmt(s,' ms')}</b> · ${m===null?'':m>=0?'偏晚 ':'偏早 '}<b>${m===null?'–':Math.abs(Math.round(m))+' ms'}</b> · 連續 <b>${st.streak}</b>`;
};
const renderSeq=()=>{$('#seq').innerHTML=seq?seq.slice(0,32).map(s=>`<i>${s.length?s.map(i=>NAMES[i]).join(''):'-'}</i>`).join(''):`<i>隨機</i>`};
let lastNx=null;
const hintUpdate=now=>{
  let kN=null;if(run&&!paused&&now>t0-stepMs*0.5)kN=Math.max(kDone,Math.ceil((now-S.offset-t0)/stepMs-0.35));
  if(kN===lastNx)return;lastNx=kN;
  const lanes=kN===null||kN>=kGen?[]:getStep(kN).lanes;
  keys.forEach((k,i)=>k.classList.toggle('nx',S.hint&&lanes.includes(i)));
  const cells=$('#seq').children;if(seq)for(let i=0;i<cells.length;i++)cells[i].classList.toggle('on',kN!==null&&i===((kN%cyc)+cyc)%cyc);
};
const loop=()=>{const now=performance.now();if(run&&!paused){schedule(now);finalize(now)}hintUpdate(now);live(now);requestAnimationFrame(loop)};

// ---- results sheet
const scatter=()=>{const c=$('#sc'),dpr=Math.min(devicePixelRatio||1,3),W=c.width=c.clientWidth*dpr,H=c.height=c.clientHeight*dpr,g=c.getContext('2d');
  const pts=hist.slice(-120),R=Math.max(60,Math.min(150,stepMs*.6)),y=d=>H/2-d/R*(H/2-6*dpr);
  g.fillStyle='rgba(77,255,195,.12)';g.fillRect(0,y(20),W,y(-20)-y(20));
  g.fillStyle='rgba(255,255,255,.3)';g.fillRect(0,H/2,W,1*dpr);
  g.font=`${11*dpr}px sans-serif`;g.fillStyle='#8f96bd';g.fillText('晚 +'+R,6*dpr,14*dpr);g.fillText('早 −'+R,6*dpr,H-6*dpr);
  pts.forEach((p,i)=>{g.fillStyle=p.l>3?'#ff8a1f':'#eef1ff';g.beginPath();g.arc((i+.5)/120*W,y(Math.max(-R,Math.min(R,p.d))),3*dpr,0,7);g.fill()})};
const results=()=>{
  const all=hist.map(h=>h.d),s=sd(all),m=mean(all),a=acc();
  $('#big').innerHTML=[['σ（穩定度）',fmt(s,' ms')],['正確率',fmt(a,'%')],['按錯 / 漏按',st.wrong+' / '+st.miss],['最長連續',st.max]]
    .map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('');
  $('#lanes').innerHTML=[...NAMES].map((n,i)=>{const d=hist.filter(h=>h.l===i).map(h=>h.d),v=sd(d);
    return `<div><b style="color:${v===null?'inherit':col(v)}">${fmt(v)}</b>${n} σ（${d.length}）</div>`}).join('');
  $('#avg').textContent=m===null?'還沒有資料':`平均 ${m>=0?'偏晚':'偏早'} ${Math.abs(Math.round(m))} ms（${all.length} 下）`;
  $('#applyOff').disabled=m===null||Math.abs(m)<3;
  requestAnimationFrame(scatter)};

// ---- input
for(const el of keys){const l=+el.dataset.l;
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('on');press(l)});
  const up=()=>el.classList.remove('on');
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
$('#pad').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
const KM={s:0,d:1,k:2,l:3,c:4,m:5};
document.addEventListener('keydown',e=>{if(!$('#sheet').hidden)return;
  if(e.code==='Space'){e.preventDefault();toggle();return}
  const l=KM[e.key.toLowerCase()];if(l===undefined||e.repeat)return;keys[l].classList.add('on');press(l)});
document.addEventListener('keyup',e=>{const l=KM[e.key.toLowerCase()];if(l!==undefined)keys[l].classList.remove('on')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ui=()=>{$('#play').textContent=!run?'開始':paused?'繼續':'暫停';lastLive=0;if(paused)live(performance.now())};
$('#play').addEventListener('click',toggle);

// ---- settings
$('#pat').innerHTML=PATS.map(p=>`<option value="${p.id}">${p.n}${p.s?' — '+p.s:''}</option>`).join('');
const show=()=>{for(const f of ['pat','custom','bpm','div','click','offset'])$('#'+f).value=S[f];$('#hint').checked=S.hint;$('#flip').checked=S.flip;labels()};
const labels=()=>{$('#bpmV').textContent=S.bpm;$('#offV').textContent=(S.offset>0?'+':'')+S.offset+' ms';$('#customWrap').style.display=S.pat==='custom'?'':'none'};
let dirty=false;
for(const f of ['pat','custom','bpm','div','click','offset'])$('#'+f).addEventListener('input',e=>{const v=e.target.value;
  S[f]=['pat','custom','click'].includes(f)?v:+v;save();labels();if(['pat','custom','bpm','div'].includes(f))dirty=true});
$('#hint').addEventListener('change',e=>{S.hint=e.target.checked;save();lastNx=undefined});
$('#flip').addEventListener('change',e=>{S.flip=e.target.checked;save();fit()});
const openSheet=()=>{pause();show();results();dirty=false;$('#sheet').hidden=false};
const closeSheet=()=>{$('#sheet').hidden=true;if(dirty){run=false;setup();ui();$('#live').textContent='設定已變更，按「開始」重新開始'}};
$('#gear').addEventListener('click',openSheet);$('#close').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#applyOff').addEventListener('click',()=>{const m=mean(hist.map(h=>h.d));if(m===null)return;
  S.offset=Math.max(-150,Math.min(150,S.offset+Math.round(m)));save();hist=hist.map(h=>({d:h.d-m,l:h.l}));show();results()});
$('#resetStats').addEventListener('click',()=>{resetStats();results()});

// ---- always landscape: rotate the app when the screen is portrait
const app=$('#app');
const probe=$('#probe');
const fit=()=>{const pr=probe.getBoundingClientRect(),de=document.documentElement;
  let w=Math.round(Math.max(innerWidth,de.clientWidth,pr.width)),h=Math.round(Math.max(innerHeight,de.clientHeight,pr.height));
  if(navigator.standalone&&screen.width&&screen.height){const sw=Math.min(screen.width,screen.height),sh=Math.max(screen.width,screen.height);
    if(h>w){w=Math.max(w,sw);h=Math.max(h,sh)}else{w=Math.max(w,sh);h=Math.max(h,sw)}}
  const r=h>w;
  app.style.width=(r?h:w)+'px';app.style.height=(r?w:h)+'px';app.classList.toggle('rot',r);
  app.style.transform=!r?'':S.flip?`translateY(${h}px) rotate(-90deg)`:`translateX(${w}px) rotate(90deg)`};
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();setup();ui();requestAnimationFrame(loop);
$('#ver').textContent=VERSION;
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
