name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate icons
        run: |
          pip install pillow
          python tools/make_icons.py
      - uses: actions/configure-pages@v5
      - name: Collect site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact to be visible
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v5
